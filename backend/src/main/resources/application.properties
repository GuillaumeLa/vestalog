# Config locale (secrets réels, non versionnée)
spring.config.import=optional:application-local.properties

# DataSource (docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/vestalog
spring.datasource.username=vestalog
spring.datasource.password=vestalog
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=CHANGE_ME_min32chars_secret_key_here!!
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Magic Link
magic-link.expiration-ms=900000
magic-link.base-url=http://localhost:5173

# Domain restriction
allowed-domain=croix-rouge.fr

# Brevo (transactional email) — vraie clé dans application-local.properties (gitignoré)
brevo.api-key=CHANGE_ME
brevo.sender-email=vestalog@glabaden.cc
brevo.sender-name=Vestalog

# Debug
# true  → log uniquement, aucun email Brevo envoyé (dev local)
# false → envoi réel via Brevo (prod)
app.debug-mail=true

# Cookie security
server.cookie.secure=true
